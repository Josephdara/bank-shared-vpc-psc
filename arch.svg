<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Shared VPC + PSC on Google Cloud</title>
  <desc id="desc">A four-project Google Cloud architecture using Shared VPC for bank workloads and Private Service Connect to publish a partner-facing API. The partner reaches only the published API.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#23304a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow-blue" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L18,9 L0,18 z" fill="#1a73e8"/>
    </marker>
    <marker id="arrow-green" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L18,9 L0,18 z" fill="#188038"/>
    </marker>
    <marker id="arrow-purple" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L18,9 L0,18 z" fill="#7b4ab4"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6b7a; }
      .group-title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .group-kicker { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6b7a; letter-spacing: 1px; }
      .node-title { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .node-copy { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #465266; }
      .chip { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #35506f; }
      .edge-label { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #245f9e; }
      .edge-note { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6b7a; }
      .mono { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #26354a; }
    </style>
  </defs>
  <rect width="1800" height="1120" fill="#f7f9fc"/>
  <text class="title" x="60" y="62">Shared VPC + PSC on Google Cloud</text>
  <text class="subtitle" x="60" y="92">Centralized Shared VPC for bank workloads; Private Service Connect publishes only the partner API.</text>
  <!-- Partner project -->
  <rect x="55" y="150" width="380" height="742" rx="20" fill="#ffffff" stroke="#aeb8c6" stroke-width="2" filter="url(#shadow)"/>
  <text class="group-kicker" x="85" y="192">EXTERNAL CONSUMER</text>
  <text class="group-title" x="85" y="224">Partner project</text>
  <text class="node-copy" x="85" y="249">Standalone project; may sit outside</text>
  <text class="node-copy" x="85" y="271">the bank organization.</text>
  <rect x="88" y="292" width="314" height="140" rx="14" fill="#f1f6ff" stroke="#8ab4f8" stroke-width="2"/>
  <text class="node-title" x="112" y="326">partner-vpc</text>
  <text class="node-copy" x="112" y="354">Custom-mode VPC network</text>
  <text class="node-title" x="112" y="389">partner-subnet</text>
  <text class="mono" x="112" y="414">192.168.1.0/24 · us-central1</text>
  <rect x="112" y="485" width="266" height="105" rx="14" fill="#ffffff" stroke="#8ab4f8" stroke-width="2"/>
  <text class="node-title" x="138" y="524">Partner client VM</text>
  <text class="node-copy" x="138" y="552">Calls the API over a private IP</text>
  <line x1="245" y1="590" x2="245" y2="660" stroke="#1a73e8" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <rect x="112" y="674" width="266" height="118" rx="14" fill="#e9f7ef" stroke="#67b77e" stroke-width="2"/>
  <text class="node-title" x="138" y="714">PSC endpoint</text>
  <text class="node-copy" x="138" y="742">Private IP in partner-subnet</text>
  <text class="node-copy" x="138" y="766">Targets the published service</text>
  <rect x="88" y="820" width="314" height="48" rx="14" fill="#e9f7ef" stroke="#67b77e" stroke-width="2"/>
  <text class="node-copy" x="112" y="850" fill="#1e6b3a">Reaches only the published API endpoint.</text>
  <!-- Bank organization -->
  <rect x="475" y="125" width="1270" height="930" rx="24" fill="#eef3fa" stroke="#7e8da3" stroke-width="2.5"/>
  <text class="group-kicker" x="510" y="165">BANK ORGANIZATION</text>
  <!-- Host project -->
  <rect x="510" y="190" width="1200" height="400" rx="18" fill="#ffffff" stroke="#6f8fb5" stroke-width="2" filter="url(#shadow)"/>
  <text class="group-kicker" x="540" y="229">CENTRAL NETWORK AND SECURITY CONTROL PLANE</text>
  <text class="group-title" x="540" y="260">Host project</text>
  <rect x="540" y="288" width="1140" height="255" rx="16" fill="#f6f9fe" stroke="#8aa5c2" stroke-width="2"/>
  <text class="node-title" x="570" y="321">Shared VPC · custom mode</text>
  <rect x="570" y="347" width="320" height="112" rx="13" fill="#e8f0fe" stroke="#8ab4f8" stroke-width="2"/>
  <text class="node-title" x="594" y="382">prod-subnet</text>
  <text class="mono" x="594" y="409">10.0.1.0/24</text>
  <text class="node-copy" x="594" y="436">us-central1 · Project A only</text>
  <rect x="950" y="347" width="320" height="112" rx="13" fill="#f3eafe" stroke="#b89be0" stroke-width="2"/>
  <text class="node-title" x="974" y="382">analytics-subnet</text>
  <text class="mono" x="974" y="409">10.0.2.0/24</text>
  <text class="node-copy" x="974" y="436">us-east1 · Project B only</text>
  <rect x="1330" y="347" width="320" height="112" rx="13" fill="#e9f7ef" stroke="#67b77e" stroke-width="2"/>
  <text class="node-title" x="1354" y="382">psc-nat-subnet</text>
  <text class="mono" x="1354" y="409">10.0.3.0/28</text>
  <text class="node-copy" x="1354" y="436">us-central1 · PSC producer NAT</text>
  <rect x="570" y="485" width="1080" height="38" rx="10" fill="#fff3cd" stroke="#e7b64b" stroke-width="1.5"/>
  <text class="chip" x="592" y="510">Central firewall: allow TCP 5432 only when source = web-app-sa and target = db-sa</text>
  <!-- Cross-project dashed connectors -->
  <polyline points="730,459 730,570 890,570 890,880" fill="none" stroke="#5b8fd9" stroke-width="3" stroke-dasharray="9 8"/>
  <text class="edge-note" x="748" y="561">Shared VPC NIC/IP</text>
  <polyline points="1110,459 1110,570 1465,570 1465,770" fill="none" stroke="#a07bd0" stroke-width="3" stroke-dasharray="9 8"/>
  <text class="edge-note" x="1238" y="561">Shared VPC NIC/IP</text>
  <polyline points="1490,459 1490,604 1160,604 1160,716 640,716 640,738" fill="none" stroke="#2f9e57" stroke-width="3" stroke-dasharray="9 8"/>
  <text class="edge-note" x="1400" y="596">PSC NAT addresses</text>
  <!-- Service project A -->
  <rect x="510" y="630" width="675" height="375" rx="18" fill="#ffffff" stroke="#5b8fd9" stroke-width="2" filter="url(#shadow)"/>
  <text class="group-kicker" x="540" y="666">SERVICE PROJECT A</text>
  <text class="group-title" x="540" y="700">Retail web and private API</text>
  <rect x="545" y="740" width="188" height="95" rx="13" fill="#e9f7ef" stroke="#67b77e" stroke-width="2"/>
  <text class="node-title" x="567" y="772">PSC service</text>
  <text class="node-title" x="567" y="794">attachment</text>
  <text class="node-copy" x="567" y="822">Accept Partner project</text>
  <rect x="798" y="740" width="188" height="95" rx="13" fill="#e9f7ef" stroke="#67b77e" stroke-width="2"/>
  <text class="node-title" x="818" y="772">Internal passthrough</text>
  <text class="node-title" x="818" y="794">load balancer</text>
  <text class="node-copy" x="818" y="822">Private frontend</text>
  <rect x="540" y="885" width="166" height="70" rx="12" fill="#f6f9fe" stroke="#aeb8c6" stroke-width="1.5"/>
  <text class="node-title" x="558" y="910" style="font-size:15px">Subnet IAM</text>
  <text class="node-copy" x="558" y="938">networkUser: prod only</text>
  <rect x="740" y="885" width="302" height="95" rx="13" fill="#f1f6ff" stroke="#8ab4f8" stroke-width="2"/>
  <text class="node-title" x="765" y="921">Web/API VM or MIG</text>
  <text class="node-copy" x="765" y="951">NIC: prod-subnet</text>
  <rect x="906" y="931" width="116" height="30" rx="15" fill="#dfe9fb"/>
  <text class="chip" x="921" y="951">web-app-sa</text>
  <!-- Service project B -->
  <rect x="1222" y="630" width="488" height="375" rx="18" fill="#ffffff" stroke="#a07bd0" stroke-width="2" filter="url(#shadow)"/>
  <text class="group-kicker" x="1250" y="666">SERVICE PROJECT B</text>
  <text class="group-title" x="1250" y="700">Analytics and database</text>
  <rect x="1300" y="775" width="330" height="115" rx="13" fill="#f3eafe" stroke="#b89be0" stroke-width="2"/>
  <text class="node-title" x="1328" y="811">Database VM</text>
  <rect x="1516" y="795" width="90" height="30" rx="15" fill="#e6d9f7"/>
  <text class="chip" x="1536" y="815" fill="#5b3a86">db-sa</text>
  <text class="node-copy" x="1328" y="843">NIC: analytics-subnet</text>
  <text class="node-copy" x="1328" y="868">Example listener: TCP 5432</text>
  <rect x="1300" y="915" width="330" height="58" rx="12" fill="#f6f9fe" stroke="#aeb8c6" stroke-width="1.5"/>
  <text class="node-title" x="1322" y="940" style="font-size:14px">Subnet IAM · networkUser: analytics only</text>
  <text class="node-copy" x="1322" y="964">Use a VM for this firewall identity lab</text>
  <!-- PSC flow (green) -->
  <rect x="380" y="597" width="279" height="31" rx="15" fill="#e9f7ef" stroke="#67b77e" stroke-width="1.5"/>
  <text class="chip" x="399" y="618" fill="#1e6b3a">Only the published API is reachable</text>
  <polyline points="378,733 465,733 465,790 535,790" fill="none" stroke="#188038" stroke-width="5" marker-end="url(#arrow-green)"/>
  <line x1="733" y1="788" x2="788" y2="788" stroke="#188038" stroke-width="5" marker-end="url(#arrow-green)"/>
  <line x1="892" y1="835" x2="892" y2="875" stroke="#188038" stroke-width="5" marker-end="url(#arrow-green)"/>
  <!-- Allowed application flow (purple) -->
  <polyline points="1042,930 1145,930 1145,835 1290,835" fill="none" stroke="#7b4ab4" stroke-width="5" marker-end="url(#arrow-purple)"/>
  <rect x="1058" y="866" width="228" height="48" rx="10" fill="#f3eafe" stroke="#b89be0" stroke-width="1.5"/>
  <text class="chip" x="1073" y="885" fill="#5b3a86">TCP 5432 · identity matched</text>
  <text class="node-copy" x="1084" y="906">web-app-sa → db-sa</text>
  <!-- Legend -->
  <line x1="62" y1="1080" x2="112" y2="1080" stroke="#188038" stroke-width="5" marker-end="url(#arrow-green)"/>
  <text class="node-copy" x="128" y="1085">Private Service Connect</text>
  <line x1="332" y1="1080" x2="382" y2="1080" stroke="#7b4ab4" stroke-width="5" marker-end="url(#arrow-purple)"/>
  <text class="node-copy" x="398" y="1085">Allowed application flow</text>
  <line x1="650" y1="1080" x2="710" y2="1080" stroke="#7e8da3" stroke-width="3" stroke-dasharray="9 8"/>
  <text class="node-copy" x="726" y="1085">Cross-project use of Shared VPC resources</text>
</svg>
